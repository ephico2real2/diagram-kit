[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "diagram-kit"
version = "0.1.0"
description = "Render each figure of a diagram source.html to light and dark PNGs, and refuse the defects a review of the SVG does not see."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["playwright==1.63.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
diagram-render = "diagram_kit.render:main"
diagram-template = "diagram_kit.template:main"

[tool.setuptools]
packages = ["diagram_kit"]

[tool.setuptools.package-data]
diagram_kit = ["template.html"]
