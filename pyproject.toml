[build-system]
requires = ["setuptools>=77"]  # PEP 639: a licence expression and license-files
build-backend = "setuptools.build_meta"

[project]
name = "diagram-kit"
version = "0.2.4"
description = "Render each figure of a diagram source.html to light and dark PNGs, and refuse the defects a review of the SVG does not see; list a workload's metrics and generate the Perses form of a Grafana dashboard."
readme = "README.md"
license = "MPL-2.0 AND MIT-0"
license-files = ["LICENSE", "LICENSES/*", "NOTICE"]
requires-python = ">=3.10"
dependencies = ["playwright==1.63.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
diagram-render = "diagram_kit.render:main"
diagram-template = "diagram_kit.template:main"
metrics-inventory = "diagram_kit.metrics:main"
perses-dashboard = "diagram_kit.perses:main"

[tool.setuptools]
packages = ["diagram_kit"]

[tool.setuptools.package-data]
diagram_kit = ["template.html"]
