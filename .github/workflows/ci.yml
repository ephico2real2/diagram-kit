name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    # It takes under two minutes. On 2026-10-07 the install step hung for an hour and would have run for six.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Playwright is pinned in pyproject.toml, and that pin chooses the Chromium build: the renders are pixels,
      # so a new browser is a deliberate bump, never whatever is newest.
      - name: Install the kit and Chromium
        run: |
          python -m pip install ".[test]"
          python -m playwright install --with-deps chromium
      # doc-docx drives pandoc, and a document's bytes depend on pandoc's version: one pinned release, checked
      # against the digest GitHub publishes for it, so the end-to-end tests run and a byte comparison means something.
      - name: Install pandoc 3.12.1
        run: |
          curl -fsSL -o "$RUNNER_TEMP/pandoc.deb" https://github.com/jgm/pandoc/releases/download/3.12.1/pandoc-3.12.1-1-amd64.deb
          echo "b4217ac7c54067c442f9d4cd38bcd0c184a43f3e7053431a12263a6f92a33ba2  $RUNNER_TEMP/pandoc.deb" | sha256sum -c -
          sudo dpkg -i "$RUNNER_TEMP/pandoc.deb"
          pandoc --version | head -1
      - name: Tests (no network)
        run: python -m pytest tests -q
      # The one step that reaches the network: the installed template and every example render, Google Fonts and
      # all, with 0 failures. The PNGs go to out/, so the committed ones are never touched.
      - name: Render the template and the examples
        run: |
          diagram-template out/template.html
          diagram-render out/template.html out template
          diagram-render examples/fan-out/source.html out/fan-out envoy-fan-out
          diagram-render examples/perses-converter/source.html out/perses-converter converter-architecture
          diagram-render --check out/template.html examples/fan-out/source.html examples/perses-converter/source.html
