name: "Owner action"
description: "Work that needs an account, a key, a plan or a decision that code cannot supply."
title: "OA-: "
type: "Task"
labels: ["task", "status:owner-action"]
body:
  - type: textarea
    id: need
    attributes:
      label: "What the owner must do"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: "Why code cannot do it"
    validations:
      required: true
  - type: textarea
    id: blocks
    attributes:
      label: "What waits for it"
      description: "The issues and the milestone that wait."
    validations:
      required: true
  - type: textarea
    id: recommendation
    attributes:
      label: "Recommendation"
      description: "The option that the review recommends, with its source."
  - type: dropdown
    id: milestone
    attributes:
      label: "Milestone"
      description: "A form cannot set the milestone. After you create the issue, set the same milestone in the sidebar. In a client copy, list the milestones of the client."
      options:
        - "Replace with the milestones of the project"
        - "Not known yet"
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: "Part of"
      description: "The parent issue. After you create the issue, add it as a sub-issue of that parent. If it has no parent, write 'None yet'."
      placeholder: "#1"
    validations:
      required: true
