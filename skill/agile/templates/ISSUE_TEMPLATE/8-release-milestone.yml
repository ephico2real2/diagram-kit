name: "Release milestone"
description: "Propose a release, before someone creates its milestone."
title: "Release: "
type: "Task"
labels: ["task", "status:open"]
body:
  - type: markdown
    attributes:
      value: "After the owner accepts this issue, create the milestone with the same name. Put the text of templates/milestone.md in the milestone description."
  - type: input
    id: name
    attributes:
      label: "Milestone name"
      description: "A short code and what ships, for example 'R1: Payments and sign-in'."
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: "Purpose"
      description: "What ships, and the commit range."
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: "Release date"
      description: "The owner sets this date. Write 'Not set' until then."
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: "Business need"
    validations:
      required: true
  - type: textarea
    id: needs
    attributes:
      label: "Needs"
      description: "The earlier milestones and the owner actions that must come first."
    validations:
      required: true
  - type: textarea
    id: rollback
    attributes:
      label: "Rollback"
      description: "The command that reverses the release, and what stays in the database."
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: "Proof"
      description: "The tests and the measurements of this cut."
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: "Part of"
      description: "The parent issue. After you create the issue, add it as a sub-issue of that parent. If it has no parent, write 'None yet'."
      placeholder: "#1"
    validations:
      required: true
