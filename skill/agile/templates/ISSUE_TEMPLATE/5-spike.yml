name: "Spike"
description: "A time-boxed question with a measured answer."
type: "Task"
labels: ["spike", "status:open"]
body:
  - type: textarea
    id: question
    attributes:
      label: "Question"
      description: "The one question that this spike answers."
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: "Options"
      description: "Each option to compare, with its source."
      placeholder: "- "
    validations:
      required: true
  - type: textarea
    id: measure
    attributes:
      label: "How the answer is measured"
      description: "The test, the data and the limit of time."
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: "Decision"
      description: "Written at the end: the choice, the measurements and the sources."
  - type: dropdown
    id: class
    attributes:
      label: "Class"
      description: "Innovation adds something new. Tech debt pays back an earlier shortcut. After you create the issue, add the same class: labels."
      multiple: true
      options:
        - "INV: innovation"
        - "TDT: tech debt"
        - "No class"
    validations:
      required: true
  - type: dropdown
    id: milestone
    attributes:
      label: "Milestone"
      description: "A form cannot set the milestone. After you create the issue, set the same milestone in the sidebar. In a client copy, list the milestones of the client."
      options:
        - "Replace with the milestones of the project"
        - "Not known yet"
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: "Part of"
      description: "The parent issue. After you create the issue, add it as a sub-issue of that parent. If it has no parent, write 'None yet'."
      placeholder: "#1"
    validations:
      required: true
