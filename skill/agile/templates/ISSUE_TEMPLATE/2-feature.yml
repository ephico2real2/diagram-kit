name: "Feature"
description: "A capability that a user sees, made of stories and tasks."
type: "Feature"
labels: ["feature", "status:open"]
body:
  - type: textarea
    id: capability
    attributes:
      label: "Capability"
      description: "Who gets what, and why it matters."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: "Context"
      description: "What exists today, with the file, the commit or the measurement."
  - type: textarea
    id: criteria
    attributes:
      label: "Acceptance criteria"
      description: "Each criterion is something that a test can show."
      placeholder: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: stories
    attributes:
      label: "Stories and tasks"
      description: "Add each one as a sub-issue too."
      placeholder: "- [ ] #"
  - type: textarea
    id: out
    attributes:
      label: "Out of scope"
      placeholder: "- "
  - type: dropdown
    id: class
    attributes:
      label: "Class"
      description: "Innovation adds something that the product or the delivery does not have today, also a security control, a test method or a CI/CD gate. Tech debt pays back an earlier shortcut. Choose No class only for a fix that restores existing behavior and adds nothing. After you create the issue, add the same class: labels."
      multiple: true
      options:
        - "INV: innovation"
        - "TDT: tech debt"
        - "No class"
    validations:
      required: true
  - type: dropdown
    id: milestone
    attributes:
      label: "Milestone"
      description: "A form cannot set the milestone. After you create the issue, set the same milestone in the sidebar. In a client copy, list the milestones of the client."
      options:
        - "Replace with the milestones of the project"
        - "Not known yet"
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: "Part of"
      description: "The parent issue. After you create the issue, add it as a sub-issue of that parent. If it has no parent, write 'None yet'."
      placeholder: "#1"
    validations:
      required: true
