<title>$title$</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one card for each slide, stacked and snapped. Wide screens keep the 16:9 shape, phones let a card grow. */
:root {
  --ground: #eef1f4; --slide: #ffffff; --ink: #18212c; --muted: #58636f; --rule: #d7dce3;
  --accent: #0e6f68; --accent-wash: #e3f3f1;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0b1016; --slide: #151c25; --ink: #e5e9ef; --muted: #9aa5b3; --rule: #2a3440;
    --accent: #3fcfc0; --accent-wash: #122a28; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0b1016; --slide: #151c25; --ink: #e5e9ef; --muted: #9aa5b3; --rule: #2a3440;
  --accent: #3fcfc0; --accent-wash: #122a28; color-scheme: dark;
}
html { scroll-snap-type: y proximity; }
body { background: var(--ground); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); counter-reset: slide; }
.deck { display: grid; gap: 28px; max-width: 1040px; margin: 0 auto; }
.slide, section.level2 { background: var(--slide); border: 1px solid var(--rule); border-radius: 12px;
  padding: clamp(20px, 4vw, 48px); min-width: 0; scroll-snap-align: start; position: relative;
  counter-increment: slide; display: flex; flex-direction: column; gap: 14px; }
@media (min-width: 900px) { .slide, section.level2 { aspect-ratio: 16 / 9; overflow: auto; } }
section.level2::after { content: counter(slide); position: absolute; right: 20px; bottom: 14px;
  font: 600 12px/1 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.title-slide { justify-content: center; background: var(--accent-wash); }
.title-slide h1 { font-size: clamp(32px, 5.5vw, 56px); line-height: 1.05; margin: 0; letter-spacing: -0.01em;
  text-wrap: balance; }
.title-slide .subtitle { font-size: clamp(17px, 2.2vw, 22px); color: var(--ink); margin: 0; max-width: 40ch; }
.title-slide .byline { font: 400 14px/1.5 var(--font-mono); color: var(--muted); margin: 8px 0 0; }
h2 { font-size: clamp(22px, 3vw, 30px); margin: 0; line-height: 1.15; text-wrap: balance; }
section.level2 > h2::before { content: ""; display: block; width: 36px; height: 3px; background: var(--accent);
  margin-bottom: 14px; border-radius: 2px; }
ul { margin: 0; padding-left: 1.2em; display: grid; gap: 8px; max-width: 70ch; }
li { font-size: clamp(15px, 1.7vw, 19px); }
li::marker { color: var(--accent); }
p { margin: 0; max-width: 70ch; }
code { font-family: var(--font-mono); font-size: .88em; }
a { color: var(--accent); }
.table-wrap { overflow-x: auto; min-width: 0; }
table { border-collapse: collapse; width: 100%; font-size: clamp(13px, 1.5vw, 16px); }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
figure { margin: 0; flex: 1; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
figure img.fig { max-width: 100%; width: 100%; height: auto; max-height: 100%; object-fit: contain; border-radius: 8px; }
figcaption { color: var(--muted); font-size: 14px; }
.fig-dark { display: none; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .fig-light { display: none; }
  :root:not([data-theme="light"]) .fig-dark { display: block; }
}
:root[data-theme="dark"] .fig-light { display: none; }
:root[data-theme="dark"] .fig-dark { display: block; }
.hint { max-width: 1040px; margin: 0 auto 16px; color: var(--muted); font-size: 13px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
<p class="hint">$hint$</p>
<main class="deck">
<header class="slide title-slide">
<h1>$title$</h1>
$if(subtitle)$<p class="subtitle">$subtitle$</p>$endif$
<p class="byline">$for(author)$$author$$sep$, $endfor$$if(date)$ · $date$$endif$</p>
</header>
$body$
</main>
<script>
// Arrow keys, Page Up and Page Down move one slide.
(() => {
  const slides = [...document.querySelectorAll(".slide, section.level2")];
  const current = () => {
    const y = window.scrollY + 40;
    let i = 0;
    slides.forEach((s, k) => { if (s.offsetTop <= y) i = k; });
    return i;
  };
  document.addEventListener("keydown", (e) => {
    const next = ["ArrowRight", "ArrowDown", "PageDown"].includes(e.key);
    const prev = ["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key);
    if (!next && !prev) return;
    const i = Math.min(slides.length - 1, Math.max(0, current() + (next ? 1 : -1)));
    slides[i].scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    e.preventDefault();
  });
})();
</script>
