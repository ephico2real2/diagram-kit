<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;650&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* doc-page: one reading column of about 70 characters, a contents rail on wide
   screens, and one optional section as a tinted band. Teal is the accent of the
   kit's figures; amber marks captions. */
:root {
  color-scheme: light;
  --bg: #ffffff;
  --surface: #ffffff;
  --fg: #1b2124;
  --muted: #59656b;
  --rule: #d9dfe1;
  --accent: #1f6f78;
  --accent-wash: #e3f0f1;
  --amber: #8a5a12;
  --code-bg: #eef1f2;
  --shot-frame: #ffffff;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --text: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
/* Light only: the page keeps a white background in every system theme, as the
   light PNG figures it shows do. */
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body {
  background: var(--bg); color: var(--fg);
  font: 400 16px/1.62 var(--text);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.page {
  max-width: 1180px; margin: 0 auto; padding-block: 40px 72px;
  display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 48px;
}
header.top { grid-column: 1 / -1; display: grid; gap: 10px; border-bottom: 1px solid var(--rule); padding-bottom: 24px; }
.eyebrow { font: 500 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
h1 { font: 650 clamp(30px, 4.2vw, 46px)/1.08 var(--display); letter-spacing: -.01em; margin: 0; text-wrap: balance; max-width: 22ch; }
.byline { color: var(--muted); margin: 0; font-size: 15px; }
nav.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 24px); align-self: start; max-height: calc(100vh - 48px); overflow: auto; }
nav.toc p { font: 500 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
nav.toc ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
nav.toc a { display: block; padding: 5px 10px; border-left: 2px solid var(--rule); color: var(--muted); text-decoration: none; font-size: 14px; line-height: 1.35; }
nav.toc a:hover, nav.toc a:focus-visible { color: var(--fg); border-left-color: var(--accent); }
main { min-width: 0; }
main > *, .story > * { max-width: 72ch; }
h2 { font: 650 26px/1.2 var(--display); margin: 56px 0 14px; text-wrap: balance; scroll-margin-top: 20px; }
h3 { font: 600 19px/1.3 var(--text); margin: 36px 0 10px; text-wrap: balance; scroll-margin-top: 20px; }
main > h2:first-child { margin-top: 0; }
p, ul, ol { margin: 0 0 14px; }
li + li { margin-top: 4px; }
a { color: var(--accent); text-underline-offset: 2px; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
code { font: 400 .88em/1.4 var(--mono); background: var(--code-bg); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
pre { background: var(--code-bg); border: 1px solid var(--rule); border-radius: 6px; padding: 14px 16px; overflow-x: auto; margin: 0 0 18px; max-width: 100%; }
pre code { background: none; padding: 0; font-size: 13px; line-height: 1.55; overflow-wrap: normal; white-space: pre; }
.scroll { overflow-x: auto; margin: 0 0 18px; max-width: 100%; }
table { border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; min-width: 640px; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-weight: 600; background: var(--surface); }
figure { margin: 22px 0 28px; max-width: none; }
.shot { background: var(--shot-frame); border: 1px solid var(--rule); border-radius: 6px; padding: 8px; overflow-x: auto; }
.shot img { display: block; width: 100%; max-width: 100%; height: auto; border-radius: 3px; }
figcaption { margin-top: 10px; padding-left: 12px; border-left: 3px solid var(--amber); color: var(--muted); font-size: 14.5px; line-height: 1.55; max-width: 80ch; }
figcaption code { font-size: .86em; }
.story {
  margin: 48px 0; padding: 8px 28px 20px; background: var(--accent-wash);
  border-radius: 10px; max-width: none;
}
.story > h2 { margin-top: 28px; }
.story h3 { color: var(--accent); }
.story figure { max-width: none; }
.story pre { background: var(--surface); }
@media (max-width: 900px) {
  .page { grid-template-columns: minmax(0, 1fr); gap: 28px; padding-block: 24px 56px; }
  nav.toc { position: static; max-height: none; border: 1px solid var(--rule); border-radius: 8px; padding: 14px; background: var(--surface); }
  .story { padding: 4px 14px 14px; margin-inline: -4px; }
}
</style>

<div class="page">
  <header class="top">
    <span class="eyebrow">{{EYEBROW}}</span>
    <h1>{{TITLE}}</h1>
    <p class="byline">{{BYLINE}}</p>
  </header>
  <nav class="toc" aria-label="Contents">
    <p>Contents</p>
    <ol>{{TOC}}</ol>
  </nav>
  <main>
{{BODY}}
  </main>
</div>
